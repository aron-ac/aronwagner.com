name: Check website

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting, lint, unit tests, the build, and the production Caddyfile's
  # response policies. Fast, and needs no browser.
  static:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:site
      - name: Install Caddy
        run: .github/install-caddy.sh
      - name: Check response policies through the VM's Caddyfile
        run: |
          deploy/serve-local.sh
          deploy/smoke.sh http://127.0.0.1:8080 http://localhost:8081

  # Browser suites against the production build served by the VM's Caddyfile,
  # split across parallel shards to keep hosted-runner time short;
  # `npm run test:browser` covers the unbuilt source locally.
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # Install one exact browser pinned by our locked Puppeteer version below.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      # Hosted runners have no graphics device. Exercise real WebGL via SwiftShader.
      BROWSER_SOFTWARE_RENDERING: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install pinned Chrome and Linux dependencies
        run: sudo env "PATH=$PATH" "PUPPETEER_CACHE_DIR=$HOME/.cache/puppeteer" npm run setup:browser -- --install-deps
      - run: npm run build:site
      - name: Install Caddy
        run: .github/install-caddy.sh
      - name: Browser suites (shard ${{ matrix.shard }} of 3)
        run: |
          deploy/serve-local.sh
          node tools/test-browser.js --url http://127.0.0.1:8080/ --shard ${{ matrix.shard }}/3
      - name: Upload browser screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-screenshots-shard-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: [static, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: production
    # Never cancel a release halfway; queue the next one instead.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - name: Configure deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Publish release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: deploy/deploy.sh
      - name: Check the live site
        run: deploy/smoke.sh https://aronwagner.com https://www.aronwagner.com
