name: Monitor live site

# Every 15 minutes, check the live site's pages, redirects, headers and 404 handling.
# A failed run emails the user who last changed this schedule. GitHub pauses scheduled
# workflows after 60 days without repository activity; re-enable it from the Actions tab.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check https://aronwagner.com
        # Retry once so a single dropped request isn't reported as an outage.
        run: |
          deploy/smoke.sh https://aronwagner.com https://www.aronwagner.com ||
            { sleep 60; deploy/smoke.sh https://aronwagner.com https://www.aronwagner.com; }
